services:
  n8n:
    # Using :latest for both images. The runners tag MUST match this tag.
    image: n8nio/n8n:latest
    container_name: n8n-main
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # ---- Task runner: external mode ----
      - N8N_RUNNERS_MODE=external
      # Shared secret between n8n and the runners container.
      - N8N_RUNNERS_AUTH_TOKEN=a96ec53a97bd0625d013e4884d7e98433ed56e265f5927598067a8ee6a337e3a
      # Let the broker accept connections from the runners container.
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      # Enable the native Python runner.
      - N8N_NATIVE_PYTHON_RUNNER=true
      # Allow Python standard-library imports (* = all; or list e.g. base64,io,zipfile,xml).
      - N8N_RUNNERS_STDLIB_ALLOW=*
      # Needed on n8n 1.x (deprecated from 2.0 — harmless to keep for now).
      - N8N_RUNNERS_ENABLED=true
      # Store binary data inline (in-memory) so it travels as base64 inside
      # the item — required for the native Python runner to read files, since
      # the runner container can't reach n8n's filesystem binary store.
      - N8N_DEFAULT_BINARY_DATA_MODE=default
      # Timezone (optional).
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n-net

  n8n-runners:
    # Custom image = n8nio/runners:latest + PyMuPDF (see Dockerfile.runners).
    # Base tag inside that Dockerfile MUST match the n8n image tag above.
    build:
      context: .
      dockerfile: Dockerfile.runners
    container_name: n8n-runners
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      # Same token as the n8n service above.
      - N8N_RUNNERS_AUTH_TOKEN=a96ec53a97bd0625d013e4884d7e98433ed56e265f5927598067a8ee6a337e3a
      # Point the runner at the n8n broker (service name + broker port 5679).
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-main:5679
      # Enable the native Python runner here too.
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      # Custom launcher config: allowlists stdlib (and JS built-ins) for the runners.
      # This overrides the image's default config, which forces the allowlist to empty.
      - ./n8n-task-runners.json:/etc/n8n-task-runners.json:ro
    networks:
      - n8n-net

  enrichapi:
    build:
      context: .
      dockerfile: Dockerfile.enrich
    container_name: enrichapi
    restart: unless-stopped
    ports:
      # host:container — reachable from your machine at http://localhost:6789
      - "6789:6789"
    networks:
      - n8n-net

volumes:
  n8n_data:

networks:
  n8n-net:
    driver: bridge
